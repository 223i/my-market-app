<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
    <div class="container p-2">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card mt-5">
                    <div class="card-header">
                        <h4 class="text-center mb-0">
                            <span class="badge text-bg-success">Вход в систему</span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <!-- Сообщения -->
                        <div th:if="${error}" class="alert alert-danger">
                            Неверное имя пользователя или пароль
                        </div>
                        <div th:if="${logout and not error}" class="alert alert-success">
                            Вы успешно вышли из системы
                        </div>

                        <!-- Кнопка логина через Keycloak OAuth2 -->
                        <div class="text-center mb-4">
                            <p class="text-muted">Нажмите кнопку ниже для входа через Keycloak</p>
                        </div>
                        <div class="d-grid gap-2">
                            <a th:href="@{/oauth2/authorization/keycloak}" class="btn btn-success">
                                <i class="bi bi-box-arrow-in-right"></i> Войти через Keycloak
                            </a>
                        </div>

                        <hr class="my-4">
                        
                        <!-- Кнопка продолжить без авторизации -->
                        <div class="d-grid gap-2">
                            <a href="/items" class="btn btn-outline-secondary">
                                <i class="bi bi-eye"></i> Продолжить без авторизации
                            </a>
                        </div>
                        
                        <div class="text-center mt-3">
                            <small class="text-muted">
                                Без авторизации вы сможете просматривать товары, 
                                но не сможете добавлять их в корзину или оформлять заказы
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>

</html>
