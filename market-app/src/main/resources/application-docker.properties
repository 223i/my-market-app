# Database configuration
spring.datasource.url=r2dbc:h2:tcp://market-db:9092/market
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver

# Redis configuration
spring.data.redis.host=market-redis
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Payment service configuration
payment.service.url=http://payment-service:8081

# Logging configuration
logging.level.com.iron.mymarket=INFO
logging.level.org.springframework.web=DEBUG
logging.level.reactor.netty=INFO

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server configuration
server.port=8080

# Client (Market App)
spring.security.oauth2.client.registration.keycloak.client-id=market-app-client
spring.security.oauth2.client.registration.keycloak.client-secret=t1FyXM72wuNhCFka5U8uFJoCRDED9EDS
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code

# Provider (Keycloak)
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8082/realms/market-app-realm

# OAuth2 Resource Server (JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8082/realms/market-app-realm
