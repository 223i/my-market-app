# Database configuration
spring.datasource.url=r2dbc:h2:tcp://market-db:9092/market
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver

# Redis configuration
spring.data.redis.host=market-redis
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Payment service configuration
payment.service.url=http://payment-service:8081

# Logging configuration
logging.level.com.iron.mymarket=INFO
logging.level.org.springframework.web=DEBUG
logging.level.reactor.netty=INFO

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server configuration
server.port=8080

# Client (Market App)
spring.security.oauth2.client.registration.keycloak.client-id=market-app-client
spring.security.oauth2.client.registration.keycloak.client-secret=FUlMPzkxr2ZZbqqTQuakCxKL5QeeT2U1
spring.security.oauth2.client.registration.keycloak.scope=openid,profile
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/keycloak

# Provider (Keycloak)
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://keycloak:8080/realms/market-app-realm/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.token-uri=http://keycloak:8080/realms/market-app-realm/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://localhost:8082/realms/market-app-realm/protocol/openid-connect/auth
#spring.security.oauth2.client.provider.keycloak.user-info-uri=http://keycloak:8080/realms/market-app-realm/protocol/openid-connect/userinfo


