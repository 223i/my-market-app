# Redis configuration for tests
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

spring.cache.type=none
payment.service.url=http://payment-service:8081

spring.r2dbc.url=r2dbc:h2:mem:///usersdb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.r2dbc.username=sa
spring.r2dbc.password=
spring.sql.init.mode=always

# Test security configuration
spring.security.oauth2.client.registration.keycloak.client-id=test-client
spring.security.oauth2.client.registration.keycloak.client-secret=test-secret
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://test-keycloak:8080/realms/test-realm
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://test-keycloak:8080/realms/test-realm


spring.main.allow-bean-definition-overriding=true